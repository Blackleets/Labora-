name: Labora+ CI

on:
  push:
    branches:
      - main
      - feat/labora-functional-closeout
      - feat/labora-completion-close
      - feat/labora-release-gates
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/create-checkout-session/index.ts
          deno check --node-modules-dir=auto supabase/functions/create-billing-portal-session/index.ts
          deno check --node-modules-dir=auto supabase/functions/stripe-webhook/index.ts
          deno check --node-modules-dir=auto supabase/functions/labora-ai/index.ts

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Unit tests, lint and debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: labora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
