name: Labora+ CI

on:
  push:
    branches:
      - main
      - feat/labora-functional-closeout
      - feat/labora-completion-close
      - feat/labora-release-gates
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Release readiness static gate
        run: npm run release:check

      - name: Build
        run: npm run build

      - name: Verify shipped styles
        run: npm run styles:check

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/create-checkout-session/index.ts
          deno check --node-modules-dir=auto supabase/functions/create-billing-portal-session/index.ts
          deno check --node-modules-dir=auto supabase/functions/stripe-webhook/index.ts
          deno check --node-modules-dir=auto supabase/functions/labora-ai/index.ts
          deno check --node-modules-dir=auto supabase/functions/delete-account/index.ts
          deno check --node-modules-dir=auto supabase/functions/admin-overview/index.ts

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android
          node scripts/check-built-styles.mjs android/app/src/main/assets/public

      - name: Unit tests, lint and debug APKs (play + labs)
        working-directory: android
        run: ./gradlew --no-daemon testPlayDebugUnitTest testLabsDebugUnitTest lintPlayDebug lintLabsDebug assemblePlayDebug assembleLabsDebug

      - name: Play APK must not contain the notification listener
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          PLAY=android/app/build/outputs/apk/play/debug/app-play-debug.apk
          LABS=android/app/build/outputs/apk/labs/debug/app-labs-debug.apk
          if $AAPT2 dump xmltree --file AndroidManifest.xml $PLAY | grep -Eq 'NotificationListener|BIND_NOTIFICATION_LISTENER_SERVICE'; then echo "play manifest declares a notification listener"; exit 1; fi
          if unzip -p $PLAY 'classes*.dex' | grep -aq 'OrderNotificationListener\|OfferParser'; then echo "play dex contains listener/parser code"; exit 1; fi
          $AAPT2 dump xmltree --file AndroidManifest.xml $LABS | grep -q 'OrderNotificationListener'
          echo "OK: listener only in labs"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: labora-debug-apks
          path: |
            android/app/build/outputs/apk/play/debug/app-play-debug.apk
            android/app/build/outputs/apk/labs/debug/app-labs-debug.apk
          retention-days: 14
