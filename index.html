    <style>
      :root {
        --font-primary: 'Outfit', 'Plus Jakarta Sans', sans-serif;
        --font-serif: 'Fraunces', Georgia, serif;
        --font-body: 'Outfit', 'Inter', sans-serif;
        --primary: #2D5A43;
        --secondary: #1F2937;
        
        /* Ghibli Natural Lighting Variables */
        --ghibli-forest: #2E5A44;
        --ghibli-deepforest: #213B2F;
        --ghibli-moss: #3B7258;
        --ghibli-softgreen: #EBF3ED;
        --ghibli-bordergreen: #D0E5D7;
        --ghibli-clay: #C96846;
        --ghibli-terracotta: #D97757;
        --ghibli-warmearth: #FAF3EE;
        --ghibli-borderclay: #EAD6C9;
        --ghibli-amber: #D9943B;
        --ghibli-gold: #B87A24;
        --ghibli-softamber: #FEF7EB;
        --ghibli-borderamber: #FDE3B8;
        --ghibli-canvas: #FAF7F2;
        --ghibli-card: #FCFAF7;
        --ghibli-parchment: #FAF6EE;
        --ghibli-border: #E8DFC8;
        --ghibli-border-subtle: #EBE4D8;
        --bg-body: var(--ghibli-canvas);
      }
      
      body { 
        font-family: var(--font-body); 
        background: var(--ghibli-canvas);
        color: #292524; /* Stone 800 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.5s ease;
      }

      /* Subtle Ghibli ambient lighting layer */
      .ghibli-ambient-tint {
        transition: background-color 0.6s ease, border-color 0.6s ease, color 0.6s ease;
      }

      .font-ghibli {
        font-family: var(--font-serif);
      }

      /* Dark Mode Overrides */
      body.dark {
        background-color: #0B1120 !important;
        color: #E2E8F0 !important;
      }
      .dark .bg-white { background-color: #1E293B !important; border-color: #334155 !important; }
      .dark .text-gray-900 { color: #FFFFFF !important; }
      .dark .text-gray-800 { color: #F1F5F9 !important; }
      .dark .text-gray-600 { color: #94A3B8 !important; }
      .dark .text-gray-500 { color: #64748B !important; }
      .dark .bg-gray-50 { background-color: #0F172A !important; }
      .dark .border-gray-100, 
      .dark .border-gray-200 { border-color: #334155 !important; }

      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: var(--font-primary);
        letter-spacing: -0.025em;
      }

      /* Custom Scrollbar for Enterprise feel */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }

      /* Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.5);
      }
      
      /* Card Hover Effects */
      .hover-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .hover-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      }

      /* Input Styles Reset */
      input, select, textarea {
        font-family: var(--font-body);
      }
      
      /* Map Z-Index Fix */
      .leaflet-pane { z-index: 10 !important; }
      .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    </style>
